<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:"Montserrat";font-weight:800;src:url("../../../../assets/fonts/montserrat-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:900;src:url("../../../../assets/fonts/montserrat-latin-900-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:"Montserrat",sans-serif;font-weight:800;color:#fff;padding:14px}
.card{width:100%;height:100%;border-radius:48px;border:10px solid #b8f5ee;background:linear-gradient(160deg,#1d5155,#0b2930);display:flex;flex-direction:column;padding:56px 64px 40px}
.title{font-weight:900;font-size:62px;line-height:1.08;text-align:center}
.accent{color:#b8f5ee}
.muted{color:#ffe0ef}
.source{font-size:22px;color:#ffe0ef;text-align:center;margin-top:auto;opacity:.9}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.stat .value{font-weight:900;font-size:220px;line-height:1;color:#b8f5ee;text-shadow:0 10px 0 rgba(0,0,0,.25)}
.stat .caption{font-size:46px;text-align:center;line-height:1.2}
.items{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;margin-top:30px}
.item{display:flex;align-items:center;gap:28px;font-size:50px;line-height:1.15}
.item b{flex:0 0 86px;height:86px;border-radius:24px;background:#b8f5ee;color:#0b2930;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900}
pre{margin:auto 0;background:rgba(0,0,0,.45);border-radius:28px;padding:40px;font-family:"DejaVu Sans Mono","Consolas",monospace;font-size:40px;line-height:1.45;white-space:pre-wrap;color:#fff}
pre .c{color:#ffe0ef;opacity:.85}
.lang{font-size:26px;color:#ffe0ef;text-transform:uppercase;letter-spacing:4px;text-align:center}
.versus{flex:1;display:flex;gap:30px;margin-top:34px;align-items:stretch}
.side{flex:1;background:rgba(0,0,0,.28);border-radius:30px;padding:34px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.side h2{font-weight:900;font-size:56px;text-align:center;color:#b8f5ee}
.side p{font-size:42px;line-height:1.2}
.vs{align-self:center;font-weight:900;font-size:64px;color:#fff}
.headline{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px}
.kicker{align-self:center;background:#b8f5ee;color:#0b2930;font-weight:900;font-size:34px;padding:10px 28px;border-radius:16px;letter-spacing:3px}
.headline .title{font-size:64px}</style></head><body><div class="card"><div class="title">Voces sintéticas</div><div class="items"><div class="item"><b>1</b><span>Vocaloid: muestras unidas</span></div><div class="item"><b>2</b><span>Synthesizer V AI: redes neuronales</span></div><div class="item"><b>3</b><span>Siempre hay una voz humana base</span></div></div></div></body></html>
