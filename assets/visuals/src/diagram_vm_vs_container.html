<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="output" content="assets/visuals/diagram_vm_vs_container.png" data-width="1200" data-height="900">
<link rel="stylesheet" href="style.css">
<style>
  /* Maquina virtual: cada app lleva su sistema operativo completo. Contenedor: comparte el nucleo. */
  .cols { flex: 1; display: flex; gap: 46px; margin-top: 34px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .head { text-align: center; font-size: 46px; font-weight: 900; margin-bottom: 6px; }
  .stack { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
  .row { display: flex; gap: 12px; }
  .box { flex: 1; border-radius: 18px; padding: 22px 8px; text-align: center; font-size: 32px; font-weight: 900; }
  .app { background: #1d63ed; }
  .os { background: #e5322d; padding: 92px 8px; }
  .kernel { background: #4b5280; }
  .ok { color: #7ef0a8; text-align: center; font-size: 38px; margin-top: 14px; }
  .bad { color: #ff9b97; text-align: center; font-size: 38px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">¿Por qué pesa menos?</div>
    <div class="cols">
      <div class="col">
        <div class="head">Máquina virtual</div>
        <div class="stack">
          <div class="row"><div class="box app">App</div><div class="box app">App</div></div>
          <div class="row"><div class="box os">Sistema operativo completo</div><div class="box os">Sistema operativo completo</div></div>
          <div class="row"><div class="box kernel">Computadora</div></div>
        </div>
        <div class="bad">Gigas por app 🐢</div>
      </div>
      <div class="col">
        <div class="head">Contenedor</div>
        <div class="stack">
          <div class="row"><div class="box app">App + librerías</div><div class="box app">App + librerías</div></div>
          <div class="row"><div class="box kernel">Núcleo compartido</div></div>
          <div class="row"><div class="box kernel">Computadora</div></div>
        </div>
        <div class="ok">Megas por app ⚡</div>
      </div>
    </div>
  </div>
</body>
</html>
