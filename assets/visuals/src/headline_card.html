<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="output" content="assets/visuals/headline_card.png" data-width="1200" data-height="900">
<link rel="stylesheet" href="style.css">
<style>
  /* Titular REAL (captura de La Nacion, 27 ene 2025) + sello "EXAGERADO" nuestro como comentario. */
  .news { width: 100%; height: 100%; border-radius: 48px; border: 10px solid #fff; overflow: hidden; position: relative; background: #fff; }
  .news img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stamp {
    position: absolute; right: 46px; bottom: 70px; transform: rotate(-12deg);
    border: 12px solid var(--red); color: var(--red); font-weight: 900; font-size: 88px;
    padding: 6px 30px; border-radius: 20px; letter-spacing: 4px; background: rgba(255,255,255,.88);
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
</style>
</head>
<body>
  <div class="news">
    <img src="captures/lanacion_deepseek_headline.jpg" alt="">
    <div class="stamp">EXAGERADO</div>
  </div>
</body>
</html>
