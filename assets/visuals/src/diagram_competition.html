<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="output" content="assets/visuals/diagram_competition.png" data-width="1200" data-height="900">
<link rel="stylesheet" href="style.css">
<style>
  /* Resume chart_benchmarks: el primer puesto cambia segun la prueba. */
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; margin: 30px 10px 10px; }
  .row { display: flex; align-items: center; gap: 30px; background: rgba(255,255,255,.07); border-radius: 30px; padding: 22px 30px; }
  .row img { width: 120px; height: 120px; background: #fff; border-radius: 28px; padding: 16px; object-fit: contain; }
  .row .what { font-size: 30px; color: var(--muted); }
  .row .who { font-size: 50px; font-weight: 900; }
  .row .medal { margin-left: auto; font-size: 64px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Sin ganador absoluto</div>
    <div class="subtitle">El nº 1 cambia según la prueba</div>
    <div class="rows">
      <div class="row">
        <img src="logos/deepseek-symbol.svg" alt="">
        <div><div class="what">Matemáticas</div><div class="who">DeepSeek-R1</div></div>
        <div class="medal">🏆</div>
      </div>
      <div class="row">
        <img src="logos/claude-symbol.svg" alt="">
        <div><div class="what">Programación</div><div class="who">Claude 3.5 Sonnet</div></div>
        <div class="medal">🏆</div>
      </div>
      <div class="row">
        <img src="logos/chatgpt-symbol.svg" alt="">
        <div><div class="what">Conocimiento general</div><div class="who">ChatGPT (o1)</div></div>
        <div class="medal">🏆</div>
      </div>
    </div>
    <div class="source">Fuente: DeepSeek-R1, arXiv:2501.12948 (tabla 4)</div>
  </div>
</body>
</html>
