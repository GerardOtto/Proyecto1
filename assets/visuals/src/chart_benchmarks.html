<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="output" content="assets/visuals/chart_benchmarks.png" data-width="1200" data-height="900">
<link rel="stylesheet" href="style.css">
<style>
  /* Datos: DeepSeek-R1 (arXiv 2501.12948), Tabla 4. Cada modelo gana una prueba. */
  .legend { display: flex; justify-content: center; gap: 34px; margin-top: 20px; font-size: 27px; }
  .legend span { display: flex; align-items: center; gap: 10px; }
  .legend i { width: 26px; height: 26px; border-radius: 7px; display: inline-block; }
  .chart { flex: 1; display: flex; gap: 34px; margin: 70px 0 8px; align-items: stretch; }
  .group { flex: 1; display: flex; flex-direction: column; }
  .bars { flex: 1; display: flex; align-items: flex-end; gap: 12px; border-bottom: 4px solid rgba(255,255,255,.55); padding: 0 8px; }
  .bar { flex: 1; border-radius: 14px 14px 4px 4px; position: relative; }
  .bar b { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 900; white-space: nowrap; }
  .bar.win { box-shadow: 0 0 0 5px var(--gold); }
  .bar.win b { color: var(--gold); }
  .bar.win b::before { content: "★ "; }
  .label { text-align: center; font-size: 31px; font-weight: 900; margin-top: 14px; }
  .bench { text-align: center; font-size: 21px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Cada uno gana en algo</div>
    <div class="legend">
      <span><i style="background: var(--chatgpt)"></i>ChatGPT (o1)</span>
      <span><i style="background: var(--claude)"></i>Claude 3.5 Sonnet</span>
      <span><i style="background: var(--deepseek)"></i>DeepSeek-R1</span>
    </div>
    <div class="chart">
      <div class="group">
        <div class="bars">
          <div class="bar" style="height: 96.4%; background: var(--chatgpt)"><b>96,4</b></div>
          <div class="bar" style="height: 78.3%; background: var(--claude)"><b>78,3</b></div>
          <div class="bar win" style="height: 97.3%; background: var(--deepseek)"><b>97,3</b></div>
        </div>
        <div class="label">Matemáticas</div>
        <div class="bench">MATH-500</div>
      </div>
      <div class="group">
        <div class="bars">
          <div class="bar" style="height: 48.9%; background: var(--chatgpt)"><b>48,9</b></div>
          <div class="bar win" style="height: 50.8%; background: var(--claude)"><b>50,8</b></div>
          <div class="bar" style="height: 49.2%; background: var(--deepseek)"><b>49,2</b></div>
        </div>
        <div class="label">Programación</div>
        <div class="bench">SWE-bench Verified</div>
      </div>
      <div class="group">
        <div class="bars">
          <div class="bar win" style="height: 91.8%; background: var(--chatgpt)"><b>91,8</b></div>
          <div class="bar" style="height: 88.3%; background: var(--claude)"><b>88,3</b></div>
          <div class="bar" style="height: 90.8%; background: var(--deepseek)"><b>90,8</b></div>
        </div>
        <div class="label">Conocimiento</div>
        <div class="bench">MMLU</div>
      </div>
    </div>
    <div class="source">% de aciertos · Fuente: DeepSeek-R1, arXiv:2501.12948 (tabla 4), enero 2025</div>
  </div>
</body>
</html>
