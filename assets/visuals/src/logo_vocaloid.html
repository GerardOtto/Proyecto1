<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="output" content="assets/logos/vocaloid_logo.png" data-width="800" data-height="800">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css">
<style>
  .logo-card { gap: 40px; }
  .logo-card .badge { background: #000; border-radius: 22px; padding: 34px 44px; }
  .logo-card .badge img { width: 560px; height: 72px; display: block; }
  .logo-card .by { display: flex; align-items: center; gap: 22px; font-size: 40px; color: #6b6f8a; }
  .logo-card .by img { width: 300px; height: 82px; }
  .logo-card .tag { font-size: 40px; color: #14162b; }
</style>
</head>
<body>
  <!-- Logo de Vocaloid 2 y logotipo de Yamaha (Wikimedia Commons, dominio publico por ser tipografico). Marcas de Yamaha Corporation. -->
  <div class="logo-card" style="--brand: #39c5bb">
    <div class="badge"><img src="logos/vocaloid2-full.png" alt=""></div>
    <div class="by">de <img src="logos/yamaha-text.svg" alt=""></div>
    <div class="tag">Hatsune Miku · 2007</div>
  </div>
</body>
</html>
